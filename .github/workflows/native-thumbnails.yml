name: Native upload thumbnail checks
on:
  pull_request:
    paths:
      - 'backend/divine-thumbnails/**'
      - 'ops/divinemedia/*thumbnail*'
      - '.github/workflows/native-thumbnails.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: find backend/divine-thumbnails -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: python ops/divinemedia/prepare-thumbnail-stage.py --output /tmp/thumbnail-stage-build
      - run: git diff --check
