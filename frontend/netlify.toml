[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
# Explicit host rules preserve paths and queries on the previous Watch hostname.
[[redirects]]
  from = "https://watch.divinecreativegroup.com/*"
  to = "https://divinemedia.us/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
